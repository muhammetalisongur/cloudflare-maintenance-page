<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23020604'/%3E%3Cg fill='%234ade80'%3E%3Crect x='6' y='5' width='4' height='13' rx='2'/%3E%3Crect x='14' y='9' width='4' height='18' rx='2'/%3E%3Crect x='22' y='4' width='4' height='10' rx='2'/%3E%3C/g%3E%3C/svg%3E">
<title>Reweaving the System</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden;
    background:#020604; color:#d8ffe9; display:flex; align-items:center; justify-content:center; }
  #rain { position:fixed; inset:0; }
  .card { position:relative; z-index:5; text-align:center; max-width:560px; width:calc(100% - 40px);
    background:rgba(1,14,7,.82); border:1px solid rgba(74,222,128,.28);
    border-radius:18px; padding:30px 32px 26px; backdrop-filter:blur(6px);
    box-shadow:0 0 60px rgba(34,197,94,.14), 0 30px 80px rgba(0,0,0,.7); }
  .glitch { position:relative; display:inline-block; font-size:22px; font-weight:800;
    letter-spacing:.02em; margin-bottom:10px; color:#d8ffe9;
    text-shadow:0 0 12px rgba(74,222,128,.4); }
  .glitch::before,.glitch::after { content:attr(data-t); position:absolute; left:0; top:0; width:100%; }
  .glitch::before { color:#38bdf8; clip-path:inset(0 0 55% 0); animation:gl 2.8s steps(3) infinite; }
  .glitch::after  { color:#ff5d7e; clip-path:inset(55% 0 0 0); animation:gl 2.8s steps(3) infinite reverse; }
  @keyframes gl { 0%,88%,100% { transform:translate(0,0); opacity:0; }
    90% { transform:translate(-3px,1px); opacity:.85; }
    94% { transform:translate(3px,-1px); opacity:.85; } }
  p { font-size:14px; line-height:1.65; color:#86d1a8; }
  canvas.game { display:block; width:100%; border-radius:12px; margin-top:16px;
    background:rgba(2,20,10,.6); box-shadow:inset 0 0 0 1px rgba(74,222,128,.22);
    touch-action:manipulation; }
  .meta { display:flex; align-items:center; justify-content:space-between; margin-top:10px;
    font:700 12px/1 ui-monospace,Consolas,monospace; flex-wrap:wrap; gap:6px; }
  @media (max-width:480px) {
    .meta { flex-direction:column; align-items:center; gap:5px; }
    .card { padding:24px 18px 20px; } }
  .score { color:#4ade80; text-shadow:0 0 8px rgba(74,222,128,.5); }
  .hint { color:#3f9463; font-weight:600; }
  .type { margin-top:13px; text-align:left; min-height:20px;
    font:12px/1.6 ui-monospace,Consolas,monospace; color:#4ade80;
    text-shadow:0 0 8px rgba(74,222,128,.5); }
  .cursor::after { content:"█"; animation:cb .8s steps(1) infinite; }
  @keyframes cb { 50% { opacity:0; } }
  .online { display:none; width:100%; margin-top:16px; position:relative;
    background:linear-gradient(180deg,#2ee06d,#1ca94e); color:#02130a;
    border:0; border-radius:12px; padding:14px 20px; font:800 14px/1 inherit; cursor:pointer;
    box-shadow:0 0 18px rgba(34,197,94,.55), 0 0 48px rgba(34,197,94,.35),
      0 10px 30px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.35);
    animation:pop .35s ease-out, breathe 2s ease-in-out .35s infinite; }
  .online:hover { transform:translateY(-2px);
    box-shadow:0 0 26px rgba(34,197,94,.8), 0 0 70px rgba(34,197,94,.5),
      0 14px 34px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.4); }
  .online::before { content:""; position:absolute; inset:-14px; border-radius:20px; z-index:-1;
    background:radial-gradient(60% 100% at 50% 50%, rgba(34,197,94,.35), transparent 70%);
    filter:blur(10px); animation:breathe 2s ease-in-out infinite; }
  @keyframes pop { from { transform:scale(.92); opacity:0; } }
  @keyframes breathe { 0%,100% { opacity:.75; } 50% { opacity:1; } }
  .foot { margin-top:12px; font:600 11.5px/1 ui-monospace,Consolas,monospace; color:#2f7a50; }
</style>
</head>
<body>
  <canvas id="rain"></canvas>

  <main class="card">
    <span class="glitch" id="ttl" data-t=""></span>
    <p id="bodytxt"></p>
    <canvas class="game" id="g" width="490" height="140"></canvas>
    <div class="meta">
      <span class="score" id="scoreLine"></span>
      <span class="hint" id="hintLine"></span>
    </div>
    <div class="type"><span id="ty"></span><span class="cursor"></span></div>
    <button class="online" id="back" onclick="location.reload()"></button>
    <div class="foot" id="foot"></div>
  </main>

<script>
  var STR = {
    hint:"SPACE / TAP = JUMP", score:"SCORE:", best:"BEST:",
    back:"Reality restored — exit the Matrix",
    dead:"An agent caught you — try again",
    shot:"An agent shot you — try again",
    ok:"> link established ✓  exit gate open",
    foot:"next reality check:",
    ph:[
     {t:"REWEAVING THE SYSTEM", b:"This corner of reality is briefly offline. Stay in the simulation while the code reweaves — jump over the agents!",
      l:["> compiling core modules...","> scanning connection matrix...","> reweave 87%..."]},
     {t:"REWEAVE IS STALLING", b:"The Weaver is running slower than expected. The machines are getting impatient — no panic, yet.",
      l:["> awaiting weaver response...","> loop attempt 2...","> machine patience: 64%"]},
     {t:"AGENT ACTIVITY RISING", b:"An anomaly was detected in the system. Agents are multiplying — do not get caught down there; we cannot unplug you in time.",
      l:["> tracking anomaly...","> agent count: rising","> stealth protocol active"]},
     {t:"SENTINEL SWARM INBOUND", b:"The machines sent a Sentinel swarm toward our source block. Our engineers are sprinting to the nearest hardline.",
      l:["> sentinel radar: 400m...","> charging the EMP...","> locating hardline..."]},
     {t:"ZION HAS BEEN NOTIFIED", b:"The last human city knows. The crew of the Nebuchadnezzar is on its way — hovering in as we speak.",
      l:["> zion council assembled","> nebuchadnezzar: en route","> morpheus: 'keep the faith'"]},
     {t:"CONSULTING THE ORACLE", b:"The Oracle offered a cookie and smiled: 'Do not worry, kid. Every outage ends — the question is being ready when it does.'",
      l:["> cookies in the kitchen","> the oracle is thinking...","> prophecy: 'soon'"]},
     {t:"THE ARCHITECT STEPS IN", b:"The Architect is studying the anomaly. This is the sixth version of the simulation — the statistics favor us, ergo we return.",
      l:["> balancing equations...","> version 6.0 verified","> ergo... vis-a-vis... done"]},
     {t:"THE RED PILL KICKS IN", b:"Layers of reality are separating. Remember: there is no spoon — therefore there is no outage either. We are fixing it anyway.",
      l:["> spoon: not found","> aligning layers...","> bending the mind..."]},
     {t:"THE TRAINMAN AT THE STATION", b:"We are at Mobil Ave. Negotiating with the Trainman — once the train departs, everyone goes home.",
      l:["> station: mobil ave.","> trainman: negotiating","> fare: one cookie"]},
     {t:"NEO AT THE TABLE", b:"Neo is speaking with the Machine City. Peace — and reconnection — are closer than ever. Almost there.",
      l:["> machine city: listening","> peace terms: connectivity","> the sun is about to rise..."]}
    ]
  };
  var phase=0;
  function applyPhase(){
    var P=STR.ph[phase];
    var g=document.getElementById("ttl"); g.textContent=P.t; g.setAttribute("data-t",P.t);
    document.getElementById("bodytxt").textContent=P.b;
    ti=0; ci=0;
  }
  function init(){
    document.getElementById("scoreLine").textContent = STR.score+" 0 · "+STR.best+" 0";
    document.getElementById("hintLine").textContent = STR.hint;
    document.getElementById("back").textContent = STR.back;
    document.getElementById("foot").innerHTML = STR.foot+' <b id="s">30</b>s';
    applyPhase();
  }
  init();

  // === MATRIX RAIN ===
  var rv=document.getElementById("rain"), rx=rv.getContext("2d");
  var W,H,cols,drops,FS=16, CH="ｱｲｳｴｵｶｷｸｹｺ01<>/=+#$アカサタナ";
  function size(){ W=rv.width=innerWidth; H=rv.height=innerHeight;
    cols=Math.floor(W/FS); drops=[];
    for(var i=0;i<cols;i++) drops.push({y:Math.random()*-H/FS, sp:0.5+Math.random()*0.9}); }
  size(); addEventListener("resize",size);
  setInterval(function(){
    rx.fillStyle="rgba(2,6,4,0.12)"; rx.fillRect(0,0,W,H);
    rx.font=FS+"px monospace";
    for(var i=0;i<cols;i++){
      var d=drops[i], ch=CH[Math.floor(Math.random()*CH.length)];
      rx.fillStyle="rgba(220,255,235,.95)"; rx.fillText(ch, i*FS, d.y*FS);
      rx.fillStyle="rgba(34,197,94,.65)"; rx.fillText(ch, i*FS, (d.y-1)*FS);
      d.y+=d.sp;
      if(d.y*FS>H && Math.random()>0.975){ d.y=Math.random()*-12; d.sp=0.5+Math.random()*0.9; } }
  },50);

  // === AGENT RUNNER (fixed 60fps timestep — same speed on 120Hz screens too) ===
  var gv=document.getElementById("g"), gx=gv.getContext("2d");
  var GW=490,GH=140,GY=100,PH=30;
  var p={x:52,y:GY,vy:0,w:22,h:PH}, obs=[], bullets=[], gt=0, score=0, dead=false, glyph=0, lastShot=-999, deathBy="dead";
  var hs=0; try{ hs=+localStorage.getItem("mxhs")||0; }catch(e){}
  function scoreText(){ return STR.score+" "+score+" · "+STR.best+" "+hs; }
  document.getElementById("scoreLine").textContent = scoreText();
  function saveHs(){ if(score>hs){ hs=score;
    try{ localStorage.setItem("mxhs",hs); }catch(e){} } }
  function jump(){ if(dead){ obs=[];bullets=[];gt=0;score=0;dead=false;p.y=GY;p.vy=0;lastShot=-999;wantShooter=false;
      document.getElementById("scoreLine").textContent=scoreText(); return; }
    if(p.y>=GY-1){ p.vy=-9.8; } }
  addEventListener("keydown",function(e){ if(e.code==="Space"){ e.preventDefault(); jump(); }});
  gv.addEventListener("pointerdown",jump);
  function drawFigure(x,y,h,color,glow,agent,flash){
    gx.shadowColor=glow; gx.shadowBlur=12; gx.strokeStyle=color; gx.fillStyle=color; gx.lineWidth=2.5;
    var hy=y+6; // head
    gx.beginPath(); gx.arc(x+11,hy,5.5,0,6.284); gx.fill();
    if(agent){ gx.fillStyle="#111"; gx.fillRect(x+7,hy-2,8,3); } // sunglasses
    gx.strokeStyle=color;
    gx.beginPath();
    gx.moveTo(x+11,hy+5); gx.lineTo(x+11,y+h-9);           // torso
    gx.moveTo(x+11,hy+9); gx.lineTo(x+3,hy+16);            // arms
    gx.moveTo(x+11,hy+9); gx.lineTo(x+19,hy+15);
    gx.moveTo(x+11,y+h-9); gx.lineTo(x+4,y+h);             // legs
    gx.moveTo(x+11,y+h-9); gx.lineTo(x+18,y+h);
    gx.stroke();
    if(flash){ // muzzle flash
      gx.fillStyle="#ffd166"; gx.shadowColor="#ffb347"; gx.shadowBlur=14;
      gx.beginPath(); gx.arc(x-2,hy+13,3.5,0,6.284); gx.fill(); }
    gx.shadowBlur=0;
  }
  var wantShooter=false;
  function update(){
    gt++; glyph++;
    if(dead) return;
    p.vy+=0.58; p.y+=p.vy; if(p.y>GY){ p.y=GY; p.vy=0; }
    var speed=3.3+Math.min(2.4,score/28);   // gentle ramp, low ceiling
    // shooter duel: once requested, normal spawns pause until the screen is
    // clear so the shooter always enters alone
    var shooterOn=bullets.length>0;
    for(var i=0;i<obs.length;i++){ if(obs[i].shooter){ shooterOn=true; break; } }
    if(!wantShooter && !shooterOn && score>=3 && gt-lastShot>320 && Math.random()<0.012){ wantShooter=true; }
    if(wantShooter){
      if(obs.length===0){ obs.push({x:GW+20,flash:0,shooter:true,slow:true}); wantShooter=false; lastShot=gt; }
    } else if(!shooterOn && gt%Math.max(52,96-Math.floor(score/8))===0){ obs.push({x:GW+20,flash:0}); }
    for(var i=obs.length-1;i>=0;i--){
      var o=obs[i]; o.x-=speed*(o.slow?0.45:1); if(o.flash>0)o.flash--;
      if(o.shooter && !o.armed && o.x<GW-90){ o.armed=true; o.aim=42; } // aims as soon as it enters
      if(o.aim>0){ o.aim--;
        if(o.aim===0){ bullets.push({x:o.x-2,y:GY+19}); o.flash=9; o.slow=false; } }
      if(o.x<-30){ obs.splice(i,1); score++; document.getElementById("scoreLine").textContent=scoreText(); }
      if(p.x < o.x+20 && p.x+p.w > o.x+2 && p.y+p.h > GY+2){ dead=true; deathBy="dead"; saveHs(); } }
    for(var i=bullets.length-1;i>=0;i--){
      var b=bullets[i]; b.x-=(speed+2.3);
      if(b.x<-30){ bullets.splice(i,1); continue; }
      if(b.x>p.x-4 && b.x<p.x+p.w+4 && b.y>p.y && b.y<p.y+p.h){ dead=true; deathBy="shot"; saveHs(); } }
  }
  function render(){
    gx.clearRect(0,0,GW,GH);
    gx.font="11px monospace"; gx.fillStyle="rgba(74,222,128,.35)";
    for(var x=0;x<GW;x+=14){ gx.fillText(CH[(x/14+(glyph>>3))%CH.length|0], x, GY+PH+14); }
    gx.fillStyle="rgba(74,222,128,.5)"; gx.fillRect(0,GY+PH+2,GW,1.5);
    // bullets (red trail)
    bullets.forEach(function(b){
      var g=gx.createLinearGradient(b.x,b.y,b.x+26,b.y);
      g.addColorStop(0,"rgba(255,93,93,.95)"); g.addColorStop(1,"rgba(255,93,93,0)");
      gx.shadowColor="#ff2d2d"; gx.shadowBlur=10;
      gx.strokeStyle=g; gx.lineWidth=3; gx.beginPath();
      gx.moveTo(b.x,b.y); gx.lineTo(b.x+26,b.y); gx.stroke(); gx.shadowBlur=0; });
    obs.forEach(function(o){ drawFigure(o.x, GY, PH, "#ff5d5d", "#ff2d2d", true, o.flash>0);
      if(o.aim>0 && (o.aim%14)<7){ // aiming warning: blinking light on the muzzle
        gx.fillStyle="#ffb347"; gx.shadowColor="#ffb347"; gx.shadowBlur=10;
        gx.beginPath(); gx.arc(o.x-2, GY+19, 2.6, 0, 6.284); gx.fill(); gx.shadowBlur=0; } });
    drawFigure(p.x, p.y, PH, "#4ade80", "#22c55e", false, false);
    if(dead){
      gx.fillStyle="#d8ffe9"; gx.font="700 14px system-ui"; gx.textAlign="center";
      gx.shadowColor="#22c55e"; gx.shadowBlur=10;
      gx.fillText(STR[deathBy], GW/2, 44); gx.shadowBlur=0; gx.textAlign="left"; }
  }
  var last=performance.now(), acc=0, STEP=1000/60;
  function loop(now){
    acc+=Math.min(100, now-last); last=now;
    while(acc>=STEP){ update(); acc-=STEP; }
    render(); requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // === TYPING CONSOLE ===
  var ti=0, ci=0, ty=document.getElementById("ty"), online=false;
  setInterval(function(){
    if(online){ ty.textContent=STR.ok; return; }
    var line=STR.ph[phase].l[ti%STR.ph[phase].l.length];
    ci++; ty.textContent=line.slice(0,ci);
    if(ci>line.length+14){ ci=0; ti++; } },55);

  // === reality check: poll without interrupting the game ===
  var s=30;
  function goOnline(){
    online=true;
    document.getElementById("back").style.display="block";
    document.getElementById("foot").style.display="none";
  }
  setInterval(function(){
    if(online) return;
    s--;
    if(s<=0){ s=30;
      fetch(location.href,{method:"HEAD",cache:"no-store"}).then(function(r){
        if(r.ok){ goOnline(); }
        else { phase=(phase+1)%STR.ph.length; applyPhase(); }
      }).catch(function(){ phase=(phase+1)%STR.ph.length; applyPhase(); }); }
    if(!online){ var el=document.getElementById("s"); if(el) el.textContent=s; }
  },1000);
</script>
</body>
</html>
