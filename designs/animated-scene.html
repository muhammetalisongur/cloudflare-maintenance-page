<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Yeniden Bağlanıyor</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1200px 700px at 50% -10%, #1d2b53 0%, #10141f 55%, #0a0d14 100%);
    color:#e8ebf2; padding:24px; overflow:hidden; }
  .stars { position:fixed; inset:0; pointer-events:none; }
  .stars i { position:absolute; width:2px; height:2px; border-radius:50%;
    background:#8ea2ff; opacity:.35; animation:tw 3.2s ease-in-out infinite; }
  @keyframes tw { 50% { opacity:.9; transform:scale(1.5);} }
  .lang { position:fixed; top:18px; right:20px; display:flex; gap:4px; z-index:5;
    background:rgba(255,255,255,.07); border-radius:999px; padding:4px; backdrop-filter:blur(6px); }
  .lang button { border:0; background:transparent; color:#9aa6c2; font:600 12px/1 inherit;
    padding:6px 12px; border-radius:999px; cursor:pointer; }
  .lang button.on { background:#5b7cfa; color:#fff; }
  .wrap { text-align:center; max-width:540px; position:relative; z-index:2; }
  svg { width:min(340px, 78vw); height:auto; margin-bottom:34px; }
  .led { animation:led 1.1s steps(2) infinite; }
  .led.l2 { animation-delay:.28s; } .led.l3 { animation-delay:.55s; }
  @keyframes led { 50% { opacity:.15; } }
  .beam { stroke-dasharray:7 9; animation:flow 1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset:-16; } }
  .cloudbob { animation:bob 3.4s ease-in-out infinite; transform-origin:center; }
  @keyframes bob { 50% { transform:translateY(-7px);} }
  h1 { font-size:26px; font-weight:700; letter-spacing:-.01em; margin-bottom:14px; }
  p  { font-size:15.5px; line-height:1.7; color:#9aa6c2; }
  .count { margin-top:26px; font:600 13px/1 inherit; color:#7aa2ff; letter-spacing:.04em; }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="lang"><button id="btr">TR</button><button id="ben">EN</button></div>
  <main class="wrap">
    <svg viewBox="0 0 360 190" fill="none" aria-hidden="true">
      <!-- sunucu -->
      <rect x="28" y="70" width="96" height="88" rx="10" fill="#1a2136" stroke="#33405f" stroke-width="2"/>
      <rect x="42" y="84"  width="68" height="16" rx="4" fill="#232c48"/>
      <rect x="42" y="108" width="68" height="16" rx="4" fill="#232c48"/>
      <rect x="42" y="132" width="68" height="16" rx="4" fill="#232c48"/>
      <circle class="led"    cx="100" cy="92"  r="3.6" fill="#f2b83c"/>
      <circle class="led l2" cx="100" cy="116" r="3.6" fill="#f2b83c"/>
      <circle class="led l3" cx="100" cy="140" r="3.6" fill="#5bdb8b"/>
      <!-- baglanti isini -->
      <path class="beam" d="M124 114 C 175 114, 185 84, 236 84" stroke="#5b7cfa" stroke-width="3" stroke-linecap="round"/>
      <!-- bulut -->
      <g class="cloudbob">
        <path d="M258 100 a22 22 0 0 1 2-43 a28 28 0 0 1 54-7 a20 20 0 0 1 6 39 z"
              fill="#202a49" stroke="#41528a" stroke-width="2.5"/>
        <path d="M276 76 l10 10 l16-18" stroke="#5bdb8b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".9"/>
      </g>
    </svg>
    <h1 data-i="title"></h1>
    <p data-i="body"></p>
    <div class="count"><span data-i="retry"></span> <span id="s">30</span>s</div>
  </main>
<script>
  var T = {
    tr:{ title:"Sunucuya yeniden bağlanıyoruz", retry:"Yeniden deneme:",
      body:"Kısa süreli bir teknik çalışma nedeniyle hizmete şu an ulaşılamıyor. Bağlantı kurulduğu anda kaldığınız yerden devam edeceksiniz — hiçbir şey yapmanıza gerek yok." },
    en:{ title:"Reconnecting to the server", retry:"Retrying in:",
      body:"The service is briefly unavailable due to maintenance. You will continue right where you left off as soon as the connection is restored — no action needed." }
  };
  function setLang(l){
    document.documentElement.lang=l;
    document.querySelectorAll("[data-i]").forEach(function(e){ e.textContent=T[l][e.dataset.i]; });
    document.getElementById("btr").className=l==="tr"?"on":"";
    document.getElementById("ben").className=l==="en"?"on":"";
    try{ localStorage.setItem("mlang",l); }catch(e){}
  }
  var sv=null; try{ sv=localStorage.getItem("mlang"); }catch(e){}
  setLang(sv || ((navigator.language||"tr").toLowerCase().startsWith("tr")?"tr":"en"));
  document.getElementById("btr").onclick=function(){setLang("tr")};
  document.getElementById("ben").onclick=function(){setLang("en")};
  // yildizlar
  var st=document.getElementById("stars");
  for(var i=0;i<40;i++){ var d=document.createElement("i");
    d.style.left=(Math.random()*100)+"%"; d.style.top=(Math.random()*100)+"%";
    d.style.animationDelay=(Math.random()*3)+"s"; st.appendChild(d); }
  // geri sayim + yenile
  var s=30, el=document.getElementById("s");
  setInterval(function(){ s--; if(s<=0){ location.reload(); } el.textContent=s; },1000);
</script>
</body>
</html>
