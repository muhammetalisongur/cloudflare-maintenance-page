<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sinyal Kulesi</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden;
    background:linear-gradient(180deg,#0b1026 0%,#1b1035 55%,#2b1440 100%); color:#efe9fb;
    display:flex; align-items:flex-start; justify-content:center; }
  .lang { position:fixed; top:16px; right:18px; display:flex; gap:4px; z-index:9;
    background:rgba(255,255,255,.08); border-radius:999px; padding:4px; }
  .lang button { border:0; background:transparent; color:#b3a6d6; font:600 12px/1 inherit;
    padding:6px 12px; border-radius:999px; cursor:pointer; }
  .lang button.on { background:#a06bff; color:#fff; }
  .moon { position:fixed; top:10%; right:16%; width:74px; height:74px; border-radius:50%;
    background:#f4ecd8; box-shadow:0 0 46px rgba(244,236,216,.5), inset -16px -10px 0 rgba(0,0,0,.07); }
  .stars i { position:fixed; width:2px; height:2px; border-radius:50%; background:#cdbcf5;
    animation:tw 3s ease-in-out infinite; }
  @keyframes tw { 50% { opacity:.15; } }
  /* daglar */
  .mts { position:fixed; left:0; right:0; bottom:0; pointer-events:none; }
  /* atesbocekleri */
  .ff { position:fixed; width:4px; height:4px; border-radius:50%; background:#ffe27a;
    box-shadow:0 0 10px 2px rgba(255,226,122,.65); animation:ffly ease-in-out infinite alternate; }
  @keyframes ffly { to { transform:translate(26px,-34px); opacity:.25; } }
  /* kule sinyal halkalari */
  .ring { position:fixed; border-radius:50%; border:2px solid rgba(160,107,255,.7);
    animation:ring 3s ease-out infinite; pointer-events:none; }
  @keyframes ring { from { transform:scale(.15); opacity:.95; } to { transform:scale(1); opacity:0; } }
  .card { position:relative; z-index:5; text-align:center; max-width:470px; width:calc(100% - 44px);
    margin-top:9vh;
    background:rgba(20,14,44,.55); border:1px solid rgba(160,107,255,.22);
    border-radius:20px; padding:36px 36px 32px; backdrop-filter:blur(10px);
    box-shadow:0 26px 70px rgba(0,0,0,.5); }
  .badge { display:inline-flex; align-items:center; gap:8px; font:700 11px/1 inherit;
    letter-spacing:.13em; text-transform:uppercase; color:#c9b1ff;
    border:1px solid rgba(160,107,255,.4); border-radius:999px; padding:8px 14px; margin-bottom:18px; }
  .wave { display:inline-flex; gap:2.5px; align-items:flex-end; height:12px; }
  .wave i { width:3px; background:#a06bff; border-radius:2px; animation:wv 1s ease-in-out infinite; }
  .wave i:nth-child(2){ animation-delay:.15s; } .wave i:nth-child(3){ animation-delay:.3s; }
  .wave i:nth-child(4){ animation-delay:.45s; }
  @keyframes wv { 0%,100% { height:4px; } 50% { height:12px; } }
  h1 { font-size:22px; font-weight:720; margin-bottom:11px; letter-spacing:-.01em; }
  p  { font-size:14.5px; line-height:1.7; color:#b9aed8; }
  .foot { margin-top:20px; font:600 12.5px/1 inherit; color:#8d7fb5; }
  .foot b { color:#c9b1ff; }
</style>
</head>
<body>
  <div class="lang"><button id="btr">TR</button><button id="ben">EN</button></div>
  <div class="moon"></div><div class="stars" id="st"></div>

  <main class="card">
    <span class="badge"><span class="wave"><i></i><i></i><i></i><i></i></span><span data-i="badge"></span></span>
    <h1 data-i="title"></h1>
    <p data-i="body"></p>
    <div class="foot"><span data-i="foot"></span> <b id="s">30</b>s</div>
  </main>

  <svg class="mts" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMax slice" width="100%" height="46%">
    <path d="M0 420 L0 260 L190 150 L340 250 L520 120 L700 260 L880 170 L1070 290 L1250 190 L1440 280 L1440 420 z" fill="#231747"/>
    <path d="M0 420 L0 320 L240 220 L430 320 L640 210 L850 330 L1060 240 L1270 340 L1440 270 L1440 420 z" fill="#170f33"/>
    <path d="M0 420 L0 370 L300 290 L560 380 L820 300 L1100 390 L1440 320 L1440 420 z" fill="#0d0a22"/>
    <!-- kule: orta tepede -->
    <g id="tower" transform="translate(520,120)">
      <path d="M0 0 L-16 96 L16 96 z" fill="none" stroke="#5f5390" stroke-width="3"/>
      <line x1="-9" y1="52" x2="9" y2="52" stroke="#5f5390" stroke-width="2.5"/>
      <line x1="-13" y1="76" x2="13" y2="76" stroke="#5f5390" stroke-width="2.5"/>
      <line x1="-9" y1="52" x2="13" y2="76" stroke="#5f5390" stroke-width="1.6"/>
      <line x1="9" y1="52" x2="-13" y2="76" stroke="#5f5390" stroke-width="1.6"/>
      <circle cx="0" cy="-6" r="5" fill="#ff5d7e">
        <animate attributeName="opacity" values="1;.2;1" dur="1.3s" repeatCount="indefinite"/>
      </circle>
    </g>
  </svg>

<script>
  var T = {
    tr:{ badge:"Yayın Aranıyor", title:"Kule sinyali yeniden yayınlamak üzere",
      body:"Vadideki sunucumuz kısa bir teknik mola verdi. Kule yeniden yayına geçtiği anda bu sayfa sizi otomatik olarak içeri alacak.",
      foot:"Sonraki deneme:" },
    en:{ badge:"Searching Broadcast", title:"The tower is about to transmit again",
      body:"Our server in the valley is taking a brief technical break. The moment the tower resumes broadcasting, this page will let you right in.",
      foot:"Next attempt:" }
  };
  function setLang(l){ document.documentElement.lang=l;
    document.querySelectorAll("[data-i]").forEach(function(e){ e.textContent=T[l][e.dataset.i]; });
    document.getElementById("btr").className=l==="tr"?"on":"";
    document.getElementById("ben").className=l==="en"?"on":"";
    try{ localStorage.setItem("mlang",l); }catch(e){} }
  var sv=null; try{ sv=localStorage.getItem("mlang"); }catch(e){}
  setLang(sv || ((navigator.language||"tr").toLowerCase().startsWith("tr")?"tr":"en"));
  document.getElementById("btr").onclick=function(){setLang("tr")};
  document.getElementById("ben").onclick=function(){setLang("en")};
  // yildizlar
  var st=document.getElementById("st");
  for(var i=0;i<50;i++){ var d=document.createElement("i");
    d.style.left=(Math.random()*100)+"%"; d.style.top=(Math.random()*55)+"%";
    d.style.animationDelay=(Math.random()*3)+"s"; st.appendChild(d); }
  // atesbocekleri (alt kisim)
  for(var i=0;i<10;i++){ var f=document.createElement("i"); f.className="ff";
    f.style.left=(5+Math.random()*90)+"%"; f.style.bottom=(3+Math.random()*20)+"%";
    f.style.animationDuration=(2.5+Math.random()*3)+"s";
    f.style.animationDelay=(Math.random()*3)+"s"; document.body.appendChild(f); }
  // kule tepesinden sinyal halkalari — kule ekran konumunu hesapla
  function rings(){
    var tw=document.getElementById("tower").getBoundingClientRect();
    var cxp=tw.left+tw.width/2, cyp=tw.top;
    for(var i=0;i<3;i++){ var r=document.createElement("div"); r.className="ring";
      var sz=180; r.style.width=r.style.height=sz+"px";
      r.style.left=(cxp-sz/2)+"px"; r.style.top=(cyp-sz/2)+"px";
      r.style.animationDelay=(i*1)+"s"; document.body.appendChild(r); }
  }
  setTimeout(rings, 60); addEventListener("resize", function(){
    document.querySelectorAll(".ring").forEach(function(e){e.remove()}); rings(); });
  // geri sayim
  var s=30;
  setInterval(function(){ s--; if(s<=0)location.reload();
    document.getElementById("s").textContent=s; },1000);
</script>
</body>
</html>
