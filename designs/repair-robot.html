<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Robot Atölyesi</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden;
    background:radial-gradient(900px 600px at 50% 20%, #263042 0%, #171d29 60%, #10141d 100%);
    color:#e9edf5; display:flex; align-items:center; justify-content:center; }
  .lang { position:fixed; top:16px; right:18px; display:flex; gap:4px; z-index:9;
    background:rgba(255,255,255,.07); border-radius:999px; padding:4px; }
  .lang button { border:0; background:transparent; color:#94a3bd; font:600 12px/1 inherit;
    padding:6px 12px; border-radius:999px; cursor:pointer; }
  .lang button.on { background:#38bdf8; color:#082032; }
  .wrap { text-align:center; max-width:520px; width:calc(100% - 44px); position:relative; z-index:2; }
  /* disliler */
  .gear { position:fixed; opacity:.14; animation:spin linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  /* robot */
  .stage { position:relative; width:230px; height:220px; margin:0 auto 8px; }
  .robot { animation:hover 3.2s ease-in-out infinite; }
  @keyframes hover { 50% { transform:translateY(-9px); } }
  .eye { animation:blinkeye 4.2s steps(1) infinite; transform-origin:center; }
  @keyframes blinkeye { 0%,92%,100% { transform:scaleY(1);} 94%,96% { transform:scaleY(.08);} }
  .arm { transform-origin: 168px 118px; animation:fix 1.15s ease-in-out infinite; }
  @keyframes fix { 0%,100% { transform:rotate(0deg);} 50% { transform:rotate(-26deg);} }
  .spark { position:absolute; left:196px; top:148px; width:5px; height:5px; border-radius:50%;
    background:#ffd166; box-shadow:0 0 10px 2px rgba(255,209,102,.8);
    animation:spark 1.15s ease-out infinite; opacity:0; }
  .spark.s2 { animation-delay:.18s; left:203px; } .spark.s3 { animation-delay:.34s; top:154px; }
  @keyframes spark { 0%,42% { opacity:0; transform:translate(0,0) scale(1);}
    50% { opacity:1;} 100% { opacity:0; transform:translate(14px,16px) scale(.2);} }
  /* konusma balonu */
  .bubble { position:absolute; top:-6px; left:50%; transform:translateX(28px);
    background:#fff; color:#1f2937; font:600 12.5px/1.45 inherit; text-align:left;
    border-radius:12px 12px 12px 3px; padding:10px 13px; max-width:190px;
    box-shadow:0 10px 26px rgba(0,0,0,.35); opacity:0; transition:opacity .4s; }
  .bubble.show { opacity:1; }
  h1 { font-size:22px; font-weight:720; margin-bottom:10px; letter-spacing:-.01em; }
  p  { font-size:14.5px; line-height:1.7; color:#9daabf; }
  .prog { margin:22px auto 0; max-width:340px; }
  .prog .lab { display:flex; justify-content:space-between; font:600 11.5px/1 inherit;
    color:#7f8ca3; margin-bottom:8px; letter-spacing:.05em; }
  .bar { height:8px; border-radius:5px; background:rgba(255,255,255,.08); overflow:hidden; }
  .bar i { display:block; height:100%; width:0%; border-radius:5px;
    background:linear-gradient(90deg,#38bdf8,#7ee0a3); transition:width .9s ease; }
</style>
</head>
<body>
  <div class="lang"><button id="btr">TR</button><button id="ben">EN</button></div>
  <main class="wrap">
    <div class="stage">
      <div class="bubble" id="bub"></div>
      <svg class="robot" width="230" height="220" viewBox="0 0 230 220" fill="none">
        <!-- govde -->
        <rect x="62" y="92" width="106" height="86" rx="18" fill="#3b4a63" stroke="#55688a" stroke-width="2.5"/>
        <rect x="84" y="112" width="62" height="34" rx="8" fill="#141b28"/>
        <rect x="90" y="120" width="12" height="4" rx="2" fill="#38bdf8"/>
        <rect x="90" y="128" width="22" height="4" rx="2" fill="#22c55e"/>
        <rect x="90" y="136" width="16" height="4" rx="2" fill="#f2b83c"/>
        <!-- kafa -->
        <rect x="74" y="30" width="82" height="56" rx="16" fill="#4a5b7a" stroke="#66799c" stroke-width="2.5"/>
        <line x1="115" y1="30" x2="115" y2="16" stroke="#66799c" stroke-width="3"/>
        <circle cx="115" cy="12" r="5" fill="#ff5d7e">
          <animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/>
        </circle>
        <g class="eye"><circle cx="97"  cy="58" r="8" fill="#38bdf8"/></g>
        <g class="eye"><circle cx="133" cy="58" r="8" fill="#38bdf8"/></g>
        <path d="M103 72 Q115 79 127 72" stroke="#9fb4d8" stroke-width="3" stroke-linecap="round" fill="none"/>
        <!-- sol kol -->
        <path d="M62 108 Q40 118 44 142" stroke="#55688a" stroke-width="10" stroke-linecap="round" fill="none"/>
        <!-- sag kol (animasyonlu, anahtar tutuyor) -->
        <g class="arm">
          <path d="M168 118 Q192 126 196 146" stroke="#55688a" stroke-width="10" stroke-linecap="round" fill="none"/>
          <g transform="translate(196,146) rotate(40)">
            <rect x="-4" y="-2" width="26" height="7" rx="3" fill="#c8d3e8"/>
            <circle cx="24" cy="1.5" r="7" fill="none" stroke="#c8d3e8" stroke-width="5"/>
          </g>
        </g>
        <!-- bacaklar -->
        <rect x="84"  y="178" width="16" height="22" rx="7" fill="#3b4a63"/>
        <rect x="130" y="178" width="16" height="22" rx="7" fill="#3b4a63"/>
        <ellipse cx="115" cy="208" rx="52" ry="7" fill="rgba(0,0,0,.35)"/>
      </svg>
      <span class="spark"></span><span class="spark s2"></span><span class="spark s3"></span>
    </div>
    <h1 data-i="title"></h1>
    <p data-i="body"></p>
    <div class="prog">
      <div class="lab"><span data-i="lab"></span><span id="pct">0%</span></div>
      <div class="bar"><i id="fill"></i></div>
    </div>
  </main>
<script>
  var T = {
    tr:{ title:"Robotumuz tamirde!", lab:"ONARIM DURUMU",
      body:"Sunucuda küçük bir vida gevşedi. Tamir robotumuz işinin başında — birkaç dakikaya her şey yerli yerinde olacak.",
      says:["Şu vidayı bir sıksam…","Neredeyse bitti!","Bip bop… test ediyorum","Az kaldı, söz!","Kablolar yerine oturdu ✓"] },
    en:{ title:"Our robot is on it!", lab:"REPAIR PROGRESS",
      body:"A tiny screw came loose on the server. Our repair bot is hard at work — everything will be back in place within minutes.",
      says:["Let me tighten this…","Almost there!","Beep boop… testing","Just a moment, promise!","Cables locked in ✓"] }
  };
  var lang="tr";
  function setLang(l){ lang=l; document.documentElement.lang=l;
    document.querySelectorAll("[data-i]").forEach(function(e){ e.textContent=T[l][e.dataset.i]; });
    document.getElementById("btr").className=l==="tr"?"on":"";
    document.getElementById("ben").className=l==="en"?"on":"";
    try{ localStorage.setItem("mlang",l); }catch(e){} }
  var sv=null; try{ sv=localStorage.getItem("mlang"); }catch(e){}
  setLang(sv || ((navigator.language||"tr").toLowerCase().startsWith("tr")?"tr":"en"));
  document.getElementById("btr").onclick=function(){setLang("tr")};
  document.getElementById("ben").onclick=function(){setLang("en")};
  // arka plan dislileri
  function gear(x,y,s,d){ var g=document.createElementNS("http://www.w3.org/2000/svg","svg");
    g.setAttribute("width",s); g.setAttribute("height",s); g.setAttribute("viewBox","0 0 100 100");
    g.classList.add("gear"); g.style.left=x; g.style.top=y; g.style.animationDuration=d+"s";
    var teeth=""; for(var i=0;i<8;i++){ teeth+='<rect x="46" y="2" width="8" height="16" rx="3" fill="#8fa3c4" transform="rotate('+(i*45)+' 50 50)"/>'; }
    g.innerHTML=teeth+'<circle cx="50" cy="50" r="30" fill="none" stroke="#8fa3c4" stroke-width="10"/>';
    document.body.appendChild(g); }
  gear("6%","12%",120,14); gear("84%","64%",160,20); gear("12%","70%",90,10);
  // konusma balonu
  var bi=0, bub=document.getElementById("bub");
  function say(){ bub.classList.remove("show");
    setTimeout(function(){ bub.textContent=T[lang].says[bi%T[lang].says.length]; bi++;
      bub.classList.add("show"); },420); }
  say(); setInterval(say, 3600);
  // ilerleme + yenileme (30 sn'de dolar)
  var s=0;
  setInterval(function(){ s++;
    var pct=Math.min(100, Math.round(s/30*100));
    document.getElementById("fill").style.width=pct+"%";
    document.getElementById("pct").textContent=pct+"%";
    if(s>=31){ location.reload(); } },1000);
</script>
</body>
</html>
