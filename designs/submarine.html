<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>In Deep Waters</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden;
    background:linear-gradient(180deg,#03253a 0%,#021a2e 45%,#010e1c 100%); color:#dff3ff;
    display:flex; align-items:center; justify-content:center; }
  /* light rays */
  .rays { position:fixed; inset:0; overflow:hidden; pointer-events:none; opacity:.25; }
  .rays i { position:absolute; top:-30%; width:14vw; height:160%;
    background:linear-gradient(180deg,rgba(120,220,255,.5),transparent 70%);
    transform:rotate(14deg); filter:blur(18px); animation:sway 9s ease-in-out infinite alternate; }
  @keyframes sway { to { transform:rotate(10deg) translateX(4vw); } }
  /* bubbles */
  .bub { position:fixed; bottom:-30px; border-radius:50%;
    border:1.5px solid rgba(160,225,255,.5); background:rgba(160,225,255,.06);
    animation:rise linear infinite; pointer-events:none; }
  @keyframes rise { to { transform:translateY(-115vh) translateX(4vw); opacity:0; } }
  /* submarine */
  .subwrap { position:fixed; left:8%; top:24%; animation:float 5.2s ease-in-out infinite; z-index:1; }
  @keyframes float { 50% { transform:translateY(-16px); } }
  .ping { position:absolute; left:118px; top:26px; width:16px; height:16px; border-radius:50%;
    border:2px solid rgba(120,225,180,.8); animation:ping 2.2s ease-out infinite; }
  .ping.p2 { animation-delay:.7s; } .ping.p3 { animation-delay:1.4s; }
  @keyframes ping { from { transform:scale(.4); opacity:.9; } to { transform:scale(5.5); opacity:0; } }
  .card { position:relative; z-index:5; text-align:center; max-width:480px; width:calc(100% - 44px);
    background:rgba(4,26,42,.62); border:1px solid rgba(120,200,240,.18);
    border-radius:22px; padding:42px 38px; backdrop-filter:blur(10px);
    box-shadow:0 26px 70px rgba(0,0,0,.5); }
  .badge { display:inline-block; font:700 11px/1 inherit; letter-spacing:.14em; text-transform:uppercase;
    color:#7fdcb1; border:1px solid rgba(127,220,177,.4); border-radius:999px;
    padding:8px 14px; margin-bottom:20px; }
  h1 { font-size:23px; font-weight:720; margin-bottom:12px; letter-spacing:-.01em; }
  p  { font-size:14.5px; line-height:1.7; color:#a8cede; }
  .depth { margin-top:24px; font:600 12.5px/1 ui-monospace,Consolas,monospace; color:#5f97b5; }
  .depth b { color:#7fdcb1; }
</style>
</head>
<body>
  <div class="rays"><i style="left:12%"></i><i style="left:42%;animation-delay:2s"></i><i style="left:74%;animation-delay:4s"></i></div>

  <div class="subwrap">
    <svg width="150" height="70" viewBox="0 0 150 70" fill="none">
      <ellipse cx="70" cy="40" rx="52" ry="22" fill="#f2b83c"/>
      <ellipse cx="70" cy="40" rx="52" ry="22" fill="url(#sh)" opacity=".35"/>
      <defs><linearGradient id="sh" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#7a4d00"/></linearGradient></defs>
      <rect x="56" y="8" width="26" height="18" rx="6" fill="#e0a52f"/>
      <rect x="66" y="2" width="5" height="10" rx="2" fill="#cf9526"/>
      <circle cx="48" cy="40" r="6.5" fill="#043148" stroke="#dff3ff" stroke-width="2"/>
      <circle cx="72" cy="42" r="6.5" fill="#043148" stroke="#dff3ff" stroke-width="2"/>
      <circle cx="96" cy="40" r="6.5" fill="#043148" stroke="#dff3ff" stroke-width="2"/>
      <path d="M18 34 L4 24 v32 L18 46 z" fill="#e0a52f"/>
    </svg>
    <span class="ping"></span><span class="ping p2"></span><span class="ping p3"></span>
  </div>

  <main class="card">
    <span class="badge" id="badge"></span>
    <h1 id="title"></h1>
    <p id="body"></p>
    <div class="depth"><span id="depthLabel"></span> <b id="m">742</b> m · <span id="nextLabel"></span> <b id="s">30</b>s</div>
  </main>

<script>
  var STR = { badge:"Sonar Active", title:"Running a fault scan in deep waters",
    body:"Our server briefly lost contact with the surface. The sonar is searching for a signal — we will resurface automatically once reconnected.",
    depth:"Depth:", next:"Next scan:" };
  document.getElementById("badge").textContent = STR.badge;
  document.getElementById("title").textContent = STR.title;
  document.getElementById("body").textContent = STR.body;
  document.getElementById("depthLabel").textContent = STR.depth;
  document.getElementById("nextLabel").textContent = STR.next;
  // bubbles
  for(var i=0;i<16;i++){ var b=document.createElement("i"); b.className="bub";
    var sz=6+Math.random()*16; b.style.width=b.style.height=sz+"px";
    b.style.left=(Math.random()*100)+"%";
    b.style.animationDuration=(6+Math.random()*8)+"s";
    b.style.animationDelay=(Math.random()*8)+"s";
    document.body.appendChild(b); }
  // depth + countdown
  var s=30, m=742;
  setInterval(function(){
    s--; if(s<=0){ location.reload(); }
    document.getElementById("s").textContent=s;
    m=Math.max(0, m-(8+Math.random()*18)|0);
    document.getElementById("m").textContent=m;
  },1000);
</script>
</body>
</html>
