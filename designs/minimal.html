<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Technical Maintenance</title>
<style>
  :root { color-scheme: light dark;
    --bg:#f5f6f8; --fg:#191b1f; --card:#ffffff; --muted:#6b7280;
    --accent:#3b6cf6; --ok:#22c55e; --shadow:0 10px 40px rgba(15,23,42,.09); }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#111318; --fg:#e7e9ee; --card:#1b1f27; --muted:#8b93a1;
    --shadow:0 10px 40px rgba(0,0,0,.5); } }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--fg); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:var(--card); border-radius:20px; padding:52px 44px;
    max-width:480px; width:100%; text-align:center; box-shadow:var(--shadow); }
  .status { display:inline-flex; align-items:center; gap:8px; font:600 12px/1 inherit;
    letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
    border:1px solid rgba(127,127,127,.25); border-radius:999px; padding:8px 14px; margin-bottom:26px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#f59e0b; animation:blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  h1 { font-size:24px; font-weight:700; margin-bottom:14px; letter-spacing:-.01em; }
  p  { font-size:15px; line-height:1.65; color:var(--muted); }
  .bar { height:4px; border-radius:2px; margin-top:32px; overflow:hidden;
    background:rgba(127,127,127,.16); position:relative; }
  .bar::after { content:""; position:absolute; inset:0; width:38%; border-radius:2px;
    background:linear-gradient(90deg,var(--accent),#7aa2ff);
    animation:slide 1.7s cubic-bezier(.45,0,.55,1) infinite alternate; }
  @keyframes slide { from{transform:translateX(-12%)} to{transform:translateX(180%)} }
  .foot { margin-top:26px; font-size:12.5px; color:var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <span class="status"><span class="dot"></span><span id="status"></span></span>
    <h1 id="title"></h1>
    <p id="body"></p>
    <div class="bar"></div>
    <div class="foot" id="foot"></div>
  </main>
<script>
  var STR = { status:"Maintenance", title:"Brief technical maintenance",
    body:"Our server is temporarily unreachable. Things are usually back to normal within a few minutes — this page will refresh automatically.",
    foot:"This page retries automatically every 30 seconds." };
  document.getElementById("status").textContent = STR.status;
  document.getElementById("title").textContent = STR.title;
  document.getElementById("body").textContent = STR.body;
  document.getElementById("foot").textContent = STR.foot;
  setTimeout(function(){ location.reload(); }, 30000);
</script>
</body>
</html>
